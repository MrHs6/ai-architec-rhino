# Include this template from the repository's root .gitlab-ci.yml:
# include:
#   - local: '/rhino-plugin/ci/gitlab-ci.yml'
# Register a Windows shell runner tagged windows with PowerShell and .NET SDK 8.
stages: [build]
rhino-windows-package:
  stage: build
  tags: [windows]
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_NOLOGO: '1'
  script:
    - Set-Location rhino-plugin
    - ./scripts/build.ps1 -UseNuGet
    - ./scripts/package.ps1
  artifacts:
    name: 'ai-architec-$CI_COMMIT_SHORT_SHA'
    when: on_success
    expire_in: 30 days
    paths:
      - rhino-plugin/artifacts/releases/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^rhino-v/'
