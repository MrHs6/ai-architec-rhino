description: >
  AI Archi-Tec architectural modeling assistant for Rhino 8 on Windows.
  Bring your own OpenAI, OpenRouter, Gemini, Anthropic, xAI or compatible API
  key, or connect a desktop AI client through local MCP. Native geometry,
  editable Grasshopper definitions, explicit baking, validated plan previews,
  measured chat feedback, iterative edits and native Undo.
  Concept-modeling beta for Windows.
