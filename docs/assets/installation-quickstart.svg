<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Installation quick start</title><desc id="desc">Download the Windows installer ZIP, extract all files, close Rhino, run install.cmd, reopen Rhino and type archtec. Then choose API chat or desktop MCP.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090C18"/><stop offset="1" stop-color="#15142D"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#AA6DFF"/><stop offset="1" stop-color="#6579FF"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#AD89FF" stroke-width="1.4"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect width="1600" height="720" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1598" height="718" rx="27" fill="none" stroke="#303149"/>
<text x="64" y="62" font-size="18" fill="#AD89FF" font-weight="600">03 / INSTALLATION QUICK START</text><text x="64" y="114" font-size="42" fill="#F3F2FA" font-weight="600">From download to your first preview.</text><text x="64" y="153" font-size="23" fill="#A5ABC4" font-weight="400">Windows x64 · Licensed Rhino 8.31+ within Rhino 8 · .NET 8 runtime</text><rect x="64" y="214" width="472" height="211" rx="20" fill="#12162B" stroke="#30364F"/><text x="90" y="258" font-size="22" fill="#AD89FF" font-weight="600">01</text><text x="90" y="303" font-size="27" fill="#F3F2FA" font-weight="600">DOWNLOAD</text><text x="90" y="349" font-size="21" fill="#D7DCEC" font-weight="400">Windows installer ZIP</text><text x="90" y="385" font-size="19" fill="#A5ABC4" font-weight="400">Source code is not the installer.</text><path d="M543 320H557" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="564" y="214" width="472" height="211" rx="20" fill="#12162B" stroke="#30364F"/><text x="590" y="258" font-size="22" fill="#AD89FF" font-weight="600">02</text><text x="590" y="303" font-size="27" fill="#F3F2FA" font-weight="600">INSTALL</text><text x="590" y="349" font-size="21" fill="#D7DCEC" font-weight="400">Extract → close Rhino → install.cmd</text><text x="590" y="385" font-size="19" fill="#A5ABC4" font-weight="400">Keep the extracted files together.</text><path d="M1043 320H1057" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1064" y="214" width="472" height="211" rx="20" fill="#12162B" stroke="#30364F"/><text x="1090" y="258" font-size="22" fill="#AD89FF" font-weight="600">03</text><text x="1090" y="303" font-size="27" fill="#F3F2FA" font-weight="600">OPEN</text><text x="1090" y="349" font-size="21" fill="#D7DCEC" font-weight="400">Reopen Rhino → type archtec</text><text x="1090" y="385" font-size="19" fill="#A5ABC4" font-weight="400">Studio opens inside your document.</text><rect x="64" y="470" width="721" height="171" rx="20" fill="#181B33" stroke="#484A70"/><text x="91" y="512" font-size="20" fill="#AD89FF" font-weight="600">A / CHAT IN RHINO</text><text x="91" y="550" font-size="24" fill="#F3F2FA" font-weight="500">API profiles → key → models → select a model</text><text x="91" y="593" font-size="20" fill="#A5ABC4" font-weight="400">Describe → Generate → inspect the preview → Apply</text><rect x="813" y="470" width="721" height="171" rx="20" fill="#15252C" stroke="#3D655F"/><text x="840" y="512" font-size="20" fill="#8DE4CB" font-weight="600">B / CHAT IN YOUR AI CLIENT</text><text x="840" y="550" font-size="24" fill="#F3F2FA" font-weight="500">MCP → Codex / Claude Desktop → Connect</text><text x="840" y="593" font-size="20" fill="#A5ABC4" font-weight="400">First setup: refresh/reopen client once. Apply in Rhino.</text><text x="64" y="687" font-size="19" fill="#A5ABC4" font-weight="400">No Visual Studio, Node or SDK needed for the ready-made installer. Full instructions: docs/INSTALLATION.en.md</text></g></svg>
