<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">AI Archi-Tec connection architecture</title><desc id="desc">Two conversation routes converge on validated plans, a viewport preview and explicit user Apply. MCP has a reconnecting local bridge; provider keys and session discovery are per Windows user.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090C18"/><stop offset="1" stop-color="#15142D"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#AA6DFF"/><stop offset="1" stop-color="#6579FF"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#AD89FF" stroke-width="1.4"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect width="1600" height="1060" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1598" height="1058" rx="27" fill="none" stroke="#303149"/>
<text x="64" y="62" font-size="18" fill="#AD89FF" font-weight="600">02 / CONNECTION ARCHITECTURE</text><text x="64" y="114" font-size="42" fill="#F3F2FA" font-weight="600">Two routes. One Rhino document.</text><text x="64" y="153" font-size="23" fill="#A5ABC4" font-weight="400">API chat runs in Rhino. MCP chat runs in your desktop AI client.</text><rect x="48" y="196" width="1504" height="648" rx="20" fill="#0D1222" stroke="#3C4360"/><text x="76" y="232" font-size="17" fill="#8DE4CB" font-weight="600">YOUR WINDOWS WORKSTATION</text><rect x="82" y="270" width="360" height="170" rx="20" fill="#12162B" stroke="#30364F"/><text x="106" y="311" font-size="25" fill="#F3F2FA" font-weight="600">Rhino Studio · API route</text><text x="106" y="352" font-size="21" fill="#A5ABC4" font-weight="400">Prompt + optional reference</text><text x="106" y="382" font-size="21" fill="#A5ABC4" font-weight="400">Provider / endpoint / model</text><text x="106" y="412" font-size="21" fill="#A5ABC4" font-weight="400">Independent API profiles</text><rect x="82" y="493" width="360" height="170" rx="20" fill="#12162B" stroke="#30364F"/><text x="106" y="535" font-size="25" fill="#F3F2FA" font-weight="600">Codex / Claude Desktop</text><text x="106" y="577" font-size="21" fill="#A5ABC4" font-weight="400">Chat and attach references here</text><text x="106" y="608" font-size="21" fill="#A5ABC4" font-weight="400">Use ai-architec-rhino tools</text><rect x="508" y="493" width="355" height="170" rx="20" fill="#12162B" stroke="#30364F"/><text x="532" y="535" font-size="24" fill="#F3F2FA" font-weight="600">Reconnecting MCP bridge</text><text x="532" y="578" font-size="21" fill="#A5ABC4" font-weight="400">STDIO · UTF-8 JSON-RPC</text><text x="532" y="609" font-size="21" fill="#A5ABC4" font-weight="400">Local HTTP · 127.0.0.1:5188</text><path d="M450 578H493" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="457" y="553" font-size="15" fill="#AD89FF" font-weight="400">MCP</text><rect x="930" y="270" width="582" height="393" rx="20" fill="#16172F" stroke="#8B6DD1"/><text x="960" y="315" font-size="28" fill="#F3F2FA" font-weight="600">AI Archi-Tec · Rhino host</text><text x="960" y="361" font-size="23" fill="#C1C7DD" font-weight="400">Document context  /  read-only messages</text><text x="960" y="397" font-size="23" fill="#C1C7DD" font-weight="400">Action-plan validation  /  scoped targets</text><rect x="958" y="427" width="526" height="66" rx="14" fill="#222140" stroke="#685384"/><text x="982" y="469" font-size="23" fill="#F3F2FA" font-weight="600">Viewport preview → User clicks Apply</text><rect x="958" y="516" width="526" height="116" rx="14" fill="#152D2F" stroke="#46786D"/><text x="983" y="556" font-size="25" fill="#8DE4CB" font-weight="600">RhinoDoc · native objects</text><text x="983" y="594" font-size="21" fill="#C4E3DC" font-weight="400">Measured feedback  ·  Stable GUIDs  ·  Undo</text><path d="M871 579H914" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="877" y="555" font-size="14" fill="#AD89FF" font-weight="400">LOCAL</text><path d="M450 354H914" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="603" y="333" font-size="17" fill="#AD89FF" font-weight="600">ACTION PLAN</text><rect x="82" y="708" width="781" height="96" rx="14" fill="#141B30" stroke="#343F5A"/><text x="106" y="746" font-size="23" fill="#F3F2FA" font-weight="600">Per-user Windows DPAPI</text><text x="106" y="780" font-size="20" fill="#A5ABC4" font-weight="400">Optional API-key storage  ·  Rotating local MCP session discovery</text><path d="M686 699V675" fill="none" stroke="#8DE4CB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><rect x="930" y="708" width="582" height="96" rx="14" fill="#141B30" stroke="#343F5A"/><text x="955" y="746" font-size="22" fill="#F3F2FA" font-weight="600">Native results return to your conversation</text><text x="955" y="780" font-size="19" fill="#A5ABC4" font-weight="400">post_message  ·  get_plan_status  ·  document context</text><path d="M1220 670V697" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="896" width="781" height="112" rx="17" fill="#211A33" stroke="#645071"/><text x="108" y="936" font-size="24" fill="#F3F2FA" font-weight="600">Your configured AI provider · API route only</text><text x="108" y="974" font-size="21" fill="#A5ABC4" font-weight="400">HTTPS  ·  Your account, key, model and provider billing</text><path d="M65 354H28V951H69" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="930" y="929" font-size="20" fill="#A5ABC4" font-weight="400">Desktop AI clients use their own account access.</text><text x="930" y="961" font-size="20" fill="#A5ABC4" font-weight="400">Browser ChatGPT needs separate connector/tunnel setup.</text><text x="930" y="993" font-size="20" fill="#A5ABC4" font-weight="400">No public tunnel or account login is provisioned here.</text></g></svg>
