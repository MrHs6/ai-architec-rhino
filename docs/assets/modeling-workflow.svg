<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">From design intent to native geometry</title><desc id="desc">MCP: plan, authorize tools, execute native geometry, inspect and refine in your AI client. API: preview and Apply in Rhino.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090C18"/><stop offset="1" stop-color="#15142D"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#AA6DFF"/><stop offset="1" stop-color="#6579FF"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#AD89FF" stroke-width="1.4"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect width="1600" height="620" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1598" height="618" rx="27" fill="none" stroke="#303149"/>
<text x="64" y="62" font-size="18" fill="#AD89FF" font-weight="600">01 / MODELING WORKFLOW</text><text x="64" y="114" font-size="42" fill="#F3F2FA" font-weight="600">From intent to editable geometry.</text><text x="64" y="153" font-size="23" fill="#A5ABC4" font-weight="400">MCP stays in your AI client. API keeps its in-Rhino preview.</text><rect x="64" y="216" width="272" height="216" rx="20" fill="#12162B" stroke="#343A55"/><text x="88" y="258" font-size="21" fill="#AD89FF" font-weight="600">01</text><text x="88" y="305" font-size="25" fill="#F3F2FA" font-weight="600">DESCRIBE</text><text x="88" y="350" font-size="20" fill="#A5ABC4" font-weight="400">Prompt + dimensions</text><text x="88" y="380" font-size="20" fill="#A5ABC4" font-weight="400">Optional reference¹</text><path d="M344 321H358" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="364" y="216" width="272" height="216" rx="20" fill="#12162B" stroke="#343A55"/><text x="388" y="258" font-size="21" fill="#AD89FF" font-weight="600">02</text><text x="388" y="305" font-size="25" fill="#F3F2FA" font-weight="600">VALIDATE</text><text x="388" y="350" font-size="20" fill="#A5ABC4" font-weight="400">Structured action plan</text><text x="388" y="380" font-size="20" fill="#A5ABC4" font-weight="400">Units + target checks</text><path d="M644 321H658" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="664" y="216" width="272" height="216" rx="20" fill="#12162B" stroke="#343A55"/><text x="688" y="258" font-size="21" fill="#AD89FF" font-weight="600">03</text><text x="688" y="305" font-size="25" fill="#F3F2FA" font-weight="600">AUTHORIZE</text><text x="688" y="350" font-size="20" fill="#A5ABC4" font-weight="400">Tool approval in client</text><text x="688" y="380" font-size="20" fill="#A5ABC4" font-weight="400">API: local preview</text><path d="M944 321H958" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="964" y="216" width="272" height="216" rx="20" fill="#191A34" stroke="#8C6BDA"/><text x="988" y="258" font-size="21" fill="#8DE4CB" font-weight="600">04</text><text x="988" y="305" font-size="25" fill="#F3F2FA" font-weight="600">EXECUTE</text><text x="988" y="350" font-size="20" fill="#A5ABC4" font-weight="400">Native batch + Undo</text><text x="988" y="380" font-size="20" fill="#A5ABC4" font-weight="400">API: click Apply</text><path d="M1244 321H1258" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1264" y="216" width="272" height="216" rx="20" fill="#12162B" stroke="#343A55"/><text x="1288" y="258" font-size="21" fill="#AD89FF" font-weight="600">05</text><text x="1288" y="305" font-size="25" fill="#F3F2FA" font-weight="600">REFINE</text><text x="1288" y="350" font-size="20" fill="#A5ABC4" font-weight="400">Read measured results</text><text x="1288" y="380" font-size="20" fill="#A5ABC4" font-weight="400">Edit the same objects</text><path d="M1400 448V491H191V450" fill="none" stroke="#AD89FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="566" y="470" width="477" height="43" rx="10" fill="#101428" stroke="#101428"/><text x="587" y="499" font-size="19" fill="#AD89FF" font-weight="600">ITERATE WITH DOCUMENT CONTEXT</text><text x="64" y="563" font-size="19" fill="#A5ABC4" font-weight="400">¹ Reference support depends on the connected model. Local Analyze reads geometry without modifying it.</text></g></svg>
